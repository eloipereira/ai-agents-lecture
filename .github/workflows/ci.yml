# Cheap checks: every push and pull request. Seconds, no model calls.
name: ci
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check
      - run: uv run pytest -q
      - run: uv run python -m evals.mutate          # tests must catch planted bugs
      - run: uv run python -m evals.quiz_eval slides/lecture.md   # report only, no gate
